[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fairvalue"
version = "0.1.0"
description = "FairValue Football data and modelling pipeline (offline, batch)."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "requests>=2.32",
    "tabulate>=0.9",
    "shap>=0.46",  # per-prediction explanations for tree models (Step 4, see docs/DECISIONS.md D10)
    "psycopg[binary]>=3.2",  # load derived outputs into Postgres (Step 6)
]

[project.scripts]
fairvalue = "fairvalue.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
